name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy
      - run: docker build -t anybench-sandbox:latest .
      - run: docker pull python:3.11-slim
      - run: python -m unittest discover -s tests -v
        env:
          ANYBENCH_REQUIRE_DOCKER: '1'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Check release version
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open('pyproject.toml', 'rb') as stream:
              version = tomllib.load(stream)['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          PY
      - run: python -m build
      - run: python -m venv /tmp/anybench-release-smoke
      - run: /tmp/anybench-release-smoke/bin/pip install dist/*.whl
      - run: /tmp/anybench-release-smoke/bin/anybench start --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
