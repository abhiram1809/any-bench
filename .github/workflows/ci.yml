name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sandbox image
        run: docker build -t anybench-sandbox:latest .
      - name: Pull external harness proxy image
        run: docker pull python:3.11-slim
      - name: Run unit and Docker integration tests
        env:
          ANYBENCH_REQUIRE_DOCKER: '1'
        run: PYTHONPATH=src python -m unittest discover -s tests -v
