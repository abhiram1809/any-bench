name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy
      - run: python -m unittest discover -s tests -v
      - run: python -m build --wheel
      - name: Installed wheel and portable skill smoke test
        run: |
          python -m venv /tmp/anybench-wheel
          /tmp/anybench-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/anybench-wheel/bin/anybench --help
          /tmp/anybench-wheel/bin/anybench skill install --agent portable --scope project --project /tmp/anybench-smoke
          test -f /tmp/anybench-smoke/.agents/skills/anybench/SKILL.md
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sandbox image
        run: docker build -t anybench-sandbox:latest .
      - name: Pull external harness proxy image
        run: docker pull python:3.11-slim
      - name: Run unit and Docker integration tests
        env:
          ANYBENCH_REQUIRE_DOCKER: '1'
        run: PYTHONPATH=src python -m unittest discover -s tests -v
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio_web/package-lock.json
      - run: python -m pip install -e '.[studio,dev]' 'httpx>=0.27'
      - run: npm ci
        working-directory: studio_web
      - run: npm audit --audit-level=moderate
        working-directory: studio_web
      - run: npm run build && npm test
        working-directory: studio_web
      - run: npx playwright install --with-deps chromium
        working-directory: studio_web
      - run: npm run test:e2e
        working-directory: studio_web
      - run: python -m build --wheel
      - run: |
          python -m venv /tmp/anybench-studio-wheel
          wheels=(dist/*.whl)
          /tmp/anybench-studio-wheel/bin/pip install "${wheels[0]}[studio]"
          /tmp/anybench-studio-wheel/bin/python -c 'from pathlib import Path; import anybench; assert (Path(anybench.__file__).parent / "studio_assets/index.html").is_file()'
          /tmp/anybench-studio-wheel/bin/anybench studio --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-screenshots
          path: studio_web/test-results/*.png
