[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "any-bench"
version = "0.4.1"
description = "Build private repository coding benchmarks and run them in Docker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["benchmark", "coding agents", "llm", "evaluation"]

[project.urls]
Homepage = "https://github.com/abhiram1809/any-bench"
Documentation = "https://github.com/abhiram1809/any-bench/blob/main/docs/advanced.md"
Issues = "https://github.com/abhiram1809/any-bench/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
anybench = "anybench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anybench = ["skills/anybench/*.md", "skills/anybench/references/*.md"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/anybench/outcomes.py", "src/anybench/repository.py", "src/anybench/metrics.py"]
follow_imports = "silent"
check_untyped_defs = true
