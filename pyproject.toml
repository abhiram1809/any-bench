[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "any-bench"
version = "0.2.0"
description = "Build private repository coding benchmarks and run them in Docker"
requires-python = ">=3.11"

[project.scripts]
anybench = "anybench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anybench = ["skills/anybench/*.md", "skills/anybench/references/*.md"]
